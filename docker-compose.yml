
services:
  postgres:
    image: postgres:17-alpine
    container_name: fielddesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fielddesk
      POSTGRES_USER: fielddesk_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fielddesk_app -d fielddesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fielddesk-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: fielddesk-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      MOCK_NOTIFICATION_MODE: ${MOCK_NOTIFICATION_MODE:-temporary_once}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: fielddesk_app
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      PGDATABASE: fielddesk
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
